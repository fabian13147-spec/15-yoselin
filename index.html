<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#180006">
<title>Yoselin | Mis 15</title>
<style>
*{box-sizing:border-box}
:root{--glow:#ff174d;--line:#ffd0da}
html{scroll-behavior:smooth}
body{margin:0;background:#100207;color:#fff;font-family:Georgia,"Times New Roman",serif}
.page{position:relative;width:min(100%,720px);margin:0 auto;overflow:hidden;background:#100207;box-shadow:0 0 40px #000}
.art{position:relative;width:100%;aspect-ratio:1024/1536;background-image:url("fondo-yoselin.jpg");background-position:center top;background-size:100% 100%;background-repeat:no-repeat}
.hit{position:absolute;display:block;border:0;background:transparent;cursor:pointer;border-radius:22px;outline-offset:3px}
.hit:focus-visible{outline:2px solid white}
#eventTime{position:absolute;left:48%;top:55.2%;width:17%;height:7.2%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(18,0,6,.94);font-family:Georgia,"Times New Roman",serif;color:#fff;text-align:center;text-shadow:0 0 6px #fff;border-radius:4px;line-height:1.05}.eventHour{font-size:clamp(18px,4vw,31px)}.eventLabel{font-size:clamp(10px,1.8vw,15px);margin-top:3px}#countdown{position:absolute;left:18%;top:45.1%;width:64%;height:7.3%;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center;pointer-events:none;text-shadow:0 0 8px #ff174d;background:linear-gradient(180deg,rgba(45,0,12,.72),rgba(10,0,4,.82));border:1px solid rgba(255,190,207,.9);border-radius:18px;box-shadow:0 0 12px #ff174d99,inset 0 0 12px #ff174d55}
.unit{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.number{font-size:clamp(17px,4.6vw,39px);line-height:1.05;font-variant-numeric:tabular-nums}
.label{font-size:clamp(7px,1.5vw,13px);margin-top:4px}
#location{left:4%;top:64.2%;width:23%;height:8.7%}
#dinner{left:27.5%;top:64.2%;width:23%;height:8.7%}
#rsvp{left:51%;top:64.2%;width:23.5%;height:8.7%}
#photos{left:75%;top:64.2%;width:21%;height:8.7%}
.modal{position:fixed;inset:0;background:#080105ee;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.box{width:min(560px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#400012,#0a0205);border:1px solid #ffb5c5;border-radius:18px;padding:16px;text-align:center;box-shadow:0 0 30px #ff174d99}
.box img{display:block;max-width:100%;max-height:68vh;object-fit:contain;margin:auto;border-radius:10px}
.close{margin-top:12px;padding:10px 24px;color:#fff;background:#6b001b;border:1px solid #ffc2d0;border-radius:20px;font:inherit;cursor:pointer}
.note{font-size:14px;color:#f8dbe2}
@media(min-width:721px){.number{font-size:31px}.label{font-size:11px}}
</style>
</head>
<body>
<main class="page">
  <section class="art" aria-label="Invitación de quince años de Yoselin">
    <div id="eventTime" aria-label="Hora del evento"><span class="eventHour">20:30</span><span class="eventLabel">horas</span></div>
    <div id="countdown" aria-label="Cuenta regresiva">
      <div class="unit"><span class="number" id="days">000</span><span class="label">DÍAS</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">HORAS</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">MINUTOS</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">SEGUNDOS</span></div>
    </div>
    <a class="hit" id="location" href="https://maps.app.goo.gl/MoBPirsw92h277Qj8?g_st=aw" target="_blank" rel="noopener" aria-label="Abrir ubicación"></a>
    <button class="hit" id="dinner" type="button" aria-label="Ver cena"></button>
    <a class="hit" id="rsvp" href="https://wa.me/543743557901?text=Hola%20Yoselin%2C%20confirmo%20mi%20asistencia%20a%20tus%2015" target="_blank" rel="noopener" aria-label="Confirmar asistencia por WhatsApp"></a>
    <a class="hit" id="photos" href="#" aria-label="Álbum de fotos"></a>
  </section>
</main>
<div class="modal" id="dinnerModal" role="dialog" aria-modal="true" aria-label="Cena">
  <div class="box"><h2>🍽️ Cena</h2><img src="cena.jpeg" alt="Información de la cena" onerror="this.style.display='none';document.getElementById('imgError').hidden=false"><p id="imgError" class="note" hidden>No se encontró cena.jpeg. Verificá que esté en el repositorio junto a index.html.</p><button class="close" id="closeDinner" type="button">Cerrar</button></div>
</div>
<script>
const target=new Date('2026-12-05T20:30:00-03:00').getTime();
function updateCountdown(){
 let d=Math.max(0,target-Date.now());
 document.getElementById('days').textContent=String(Math.floor(d/86400000)).padStart(3,'0');
 document.getElementById('hours').textContent=String(Math.floor(d%86400000/3600000)).padStart(2,'0');
 document.getElementById('minutes').textContent=String(Math.floor(d%3600000/60000)).padStart(2,'0');
 document.getElementById('seconds').textContent=String(Math.floor(d%60000/1000)).padStart(2,'0');
}
updateCountdown();setInterval(updateCountdown,1000);
const modal=document.getElementById('dinnerModal');
document.getElementById('dinner').addEventListener('click',()=>modal.classList.add('open'));
document.getElementById('closeDinner').addEventListener('click',()=>modal.classList.remove('open'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
document.getElementById('photos').addEventListener('click',e=>{e.preventDefault();alert('Cuando tengas el enlace del álbum de fotos, lo conectamos a este botón.')});
</script>
</body>
</html>
